name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild at 05:00 UTC so the homepage reflects yesterday's
    # AEGIS PDNS resolver activity. Requires TECHNITIUM_API_URL and
    # TECHNITIUM_API_TOKEN repository secrets; build falls back to
    # capability text if either is missing or the API is unreachable.
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npm run build
        env:
          TECHNITIUM_API_URL: ${{ secrets.TECHNITIUM_API_URL }}
          TECHNITIUM_API_TOKEN: ${{ secrets.TECHNITIUM_API_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
